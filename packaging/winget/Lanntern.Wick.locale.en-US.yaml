ShortDescription: Get gigabytes back from the photos, videos and music already on your PC.
Description: |-
  Wick shows how much space you'd get back before it touches anything, then stores each file in a smaller format:
  JPEG XL for photos (losslessly, for JPEGs), AV1 or HEVC for videos, FLAC for uncompressed music, and smaller
  pictures inside Office and PDF documents. Every result is checked before the original is replaced, originals go
  to the Recycle Bin, and History can undo any run. It also finds duplicates, similar photos and leftovers.
