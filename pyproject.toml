[build-system]
requires = ["setuptools>=77"]   # (77: SPDX license expressions)
build-backend = "setuptools.build_meta"

[project]
name = "wick"
dynamic = ["version"]          # from wick/__init__.py: the one place a release bumps it
description = "One-click, verified, undoable image and video compression (JPEG XL, WebP, AV1, HEVC)."
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE", "THIRD-PARTY-NOTICES.md"]
authors = [{ name = "Lanntern" }]
requires-python = ">=3.11"   # 3.10 is end of life; Pillow 13 (security fixes) needs 3.11
dependencies = [
    "PySide6>=6.8",
    "send2trash>=1.8",
    "Pillow>=13.0",       # 12.x and older: decoder vulnerabilities (pip-audit)
    "pillow-heif>=1.8",
    "mozjpeg-lossless-optimization>=1.3",
    "imagequant>=1.1",
    "pyoxipng>=9.1",
    "py7zr>=1.0",
    "numpy>=1.24",
    "pikepdf>=10",
    "rawpy>=0.25",        # camera RAW photos (LibRaw), an input for Convert
    "fonttools>=4.50",    # fonts: TrueType/OpenType ↔ WOFF/WOFF2, smaller web fonts
    "brotli>=1.1",        # (WOFF2 compression, for fonttools)
    "blake3>=1.0",        # duplicate checks: a fast cryptographic hash (several times BLAKE2b's speed)
    "zopfli>=0.2",        # documents (Smallest files): denser Deflate for the text inside Office files and e-books
]

[project.urls]
Source = "https://github.com/Lanntern/Wick"
Issues = "https://github.com/Lanntern/Wick/issues"
Funding = "https://ko-fi.com/lanntern"

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6"]

[project.scripts]
wick = "wick.cli:main"

[tool.setuptools.packages.find]
include = ["wick*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
faulthandler_timeout = 300   # a hung test dumps every thread's stack instead of waiting silently
# (pytest-xdist's marker, declared here too so runs without xdist don't warn about it)
markers = [
    "xdist_group(name): tests that share outside state, run by one worker when the suite runs in parallel",
    "runs_long: a test that takes far longer than the rest; collected first so parallel workers finish together",
]

[tool.ruff]
line-length = 130
target-version = "py311"
extend-exclude = ["wick/_ssimulacra2.py"]   # vendored (BSD), kept as published

[tool.ruff.lint]
# Bugs first: pyflakes, pycodestyle errors, bugbear, pylint errors.
select = ["E4", "E7", "E9", "E501", "F", "B", "PLE", "W6", "C901", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["wick"]

[tool.ruff.lint.mccabe]
# No new function this branchy (most stay well under 10). The ones marked "noqa: C901 (to split up)" are older.
max-complexity = 25

[tool.ruff.lint.per-file-ignores]
"wick/gui/style.py" = ["E501"]                # icon paths and stylesheet text
"wick/gui/file_model.py" = ["B008"]           # Qt's own QModelIndex() default argument idiom

[tool.vulture]
# Unused code (CI's lint job). Qt and pytest call these names themselves; the allow-list holds the rest.
paths = ["wick", "tests", ".github/vulture_allowlist.py"]
exclude = ["wick/_ssimulacra2.py"]
min_confidence = 60
ignore_names = ["*Event", "paintSection", "filterAcceptsRow", "expandingDirections", "hasHeightForWidth",
                "actualSize", "pytest_*", "pytestmark"]

[tool.coverage.run]
# (CI's Linux job; Windows- and Mac-only code shows as not run there)
source = ["wick"]
omit = ["wick/_ssimulacra2.py"]   # vendored
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 65    # (69 % when this was added: a drop below this fails CI)

[tool.mypy]
python_version = "3.12"     # (CI's Python; numpy's own type stubs need 3.12 syntax)
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = false
check_untyped_defs = true
# Not checked: Qt's "lambda: (a(), b())" slot idiom, and notes about unannotated functions.
disable_error_code = ["func-returns-value", "annotation-unchecked"]
# CI checks the code once per system (see build.yml's lint job): --platform plus these constants, so each run
# skips the other systems' branches (Windows' winreg and ctypes.windll, a Mac's st_flags, Linux's os.nice).
#   mypy wick --platform linux  --always-false IS_WINDOWS --always-false IS_MAC
#   mypy wick --platform win32  --always-true IS_WINDOWS --always-false IS_MAC
#   mypy wick --platform darwin --always-false IS_WINDOWS --always-true IS_MAC

[tool.setuptools.dynamic]
version = { attr = "wick.__version__" }
